# =============================================================================
# Google Cloud Build Configuration: Build & Push GPU Worker Image to Artifact Registry
# =============================================================================

steps:
  # 0. Pull previous image to use as build cache (saves ~8-10 minutes on rebuilds!)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest || exit 0'
    id: 'pull-previous-cache'

  # 1. Build production Docker image using layer caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '-f'
      - 'gpu_worker/Dockerfile'
      - 'gpu_worker'
    id: 'build-gpu-image'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'arangtik-gpu'
  _IMAGE_NAME: 'qwen-gpu-worker'
  _TAG: 'latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '1800s'
