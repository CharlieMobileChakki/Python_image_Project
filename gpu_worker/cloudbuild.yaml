# =============================================================================
# Google Cloud Build Configuration: Build & Push GPU Worker Image to Artifact Registry
# =============================================================================

steps:
  # 1. Build production Docker image with CUDA 12.8 + Python 3.11 + PyTorch
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '-f'
      - 'gpu_worker/Dockerfile'
      - 'gpu_worker'
    id: 'build-gpu-image'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'arangtik-gpu'
  _IMAGE_NAME: 'qwen-gpu-worker'
  _TAG: 'latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '1800s'
