# =============================================================================
# Cloud Build: Download Qwen Model once and save permanently to GCS Bucket
# =============================================================================

steps:
  # 1. Download Qwen-Image-2.1-Turbo weights into local fast SSD
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir huggingface_hub[cli]
        python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen-Image-2.1-Turbo', local_dir='/workspace/qwen_model', local_dir_use_symlinks=False)"
    id: 'download-qwen-weights'

  # 2. Upload plain weights to Google Cloud Storage Bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage rsync -r /workspace/qwen_model gs://${_BUCKET_NAME}/Qwen-Image-2.1-Turbo
    id: 'upload-to-gcs'

substitutions:
  _BUCKET_NAME: 'mobile-481610-qwen-models'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '3600s'
